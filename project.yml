name: Forge
options:
  bundleIdPrefix: com.epworthlabs
  deploymentTarget:
    # Feature request — "rest timer as a lock-screen notification." Live Activities (ActivityKit)
    # need 16.1 for the type itself, but `RestTimerActivityManager` uses the `ActivityContent`-based
    # request/end APIs (which support `staleDate`) — those specifically need 16.2. Bumped
    # project-wide rather than availability-guarding just the new code, since nothing else in the
    # app needs to run below 16.2.
    iOS: "16.2"
packages:
  ForgeCore:
    path: .
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0
targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/Secrets.example.swift"
    dependencies:
      - package: ForgeCore
        product: ForgeCore
      - package: PostHog
        product: PostHog
      - target: RestTimerWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epworthlabs.forge
        # Feature request — "let's name the app: Trakt." Display name only — bundle identifier and
        # the CloudKit container (iCloud.com.epworthlabs.forge, below) are both internal, invisible
        # to users, and changing either would mean a brand-new CloudKit container + re-provisioning
        # rather than a rename. PRODUCT_NAME drives Info.plist's CFBundleName; explicit
        # CFBundleDisplayName below is belt-and-suspenders for whichever one a given context reads.
        PRODUCT_NAME: Trakt
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Real Apple Developer team, confirmed working for on-device CloudKit verification earlier
        # this session — Automatic signing has no team to resolve without this, which blocks
        # archiving/uploading to App Store Connect even though it doesn't block Simulator builds.
        DEVELOPMENT_TEAM: 88XVUU2829
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        # App icon design (5a — "Dual Ring, Bold") pulled from the claude.ai/design project and
        # rendered to App/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Trakt
        NSHealthShareUsageDescription: "Used to factor your steps and sleep into your daily targets."
        # Apple's binary scanner requires this key for any app linking HealthKit, regardless of
        # whether write access is actually used — Trakt is read-only (requestAuthorization always
        # passes toShare: []), confirmed by grepping HealthKitManager before adding this.
        NSHealthUpdateUsageDescription: "Trakt does not write any data to Health."
        # Feature request — "rest timer as a lock-screen notification." Required for
        # RestTimerActivityManager's Activity.request(...) to succeed at all — without it, every
        # request silently fails.
        NSSupportsLiveActivities: true
        # Every network call in the app is standard HTTPS/TLS (URLSession to USDA, Open Food
        # Facts, the FoodProxy, CloudKit, PostHog) — no custom/proprietary encryption — so this
        # qualifies for App Store Connect's export compliance exemption. Setting it explicitly
        # skips the encryption questionnaire on every future TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
        # Custom fonts (App/Fonts) — registered here, not by editing App/Info.plist directly:
        # xcodegen regenerates that plist from this block, so a hand-edit there is silently wiped
        # by the next `xcodegen generate` (which is exactly what happened once).
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
    entitlements:
      path: App/Forge.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.epworthlabs.forge"]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Re-added for launch — disconnected earlier this session only because it was blocking
        # Simulator testing with no team ID set (see DEVELOPMENT_TEAM above, now fixed).
        com.apple.developer.applesignin: [Default]

  # Feature request — "rest timer as a lock-screen notification." A Live Activity's UI must be
  # declared in a widget extension target — that's an ActivityKit requirement, not a choice; the
  # main Forge target only starts/updates/ends the Activity (RestTimerActivityManager). Shares
  # RestTimerAttributes.swift with the Forge target (added to both targets' sources below) since
  # ActivityKit requires the exact same attributes type compiled into both sides.
  RestTimerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RestTimerWidget
      - path: App/Store/RestTimerAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epworthlabs.forge.RestTimerWidget
        PRODUCT_NAME: RestTimerWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 88XVUU2829
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        SKIP_INSTALL: true
    info:
      path: RestTimerWidget/Info.plist
